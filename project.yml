name: LocalAI
options:
  bundleIdPrefix: com.keweiyi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ONLY_ACTIVE_ARCH: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  LocalAI:
    type: application
    platform: iOS
    sources:
      - path: LocalAI
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keweiyi.localai
        PRODUCT_NAME: LocalAI
        INFOPLIST_FILE: LocalAI/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/LocalAI/LocalAI-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/include"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - framework: ThirdParty/llama.xcframework
        embed: true
