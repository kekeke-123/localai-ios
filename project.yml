name: LocalAI
options:
  bundleIdPrefix: com.keweiyi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "27.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ONLY_ACTIVE_ARCH: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  LocalAI:
    type: application
    platform: iOS
    sources:
      - path: LocalAI
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.Siri
        NSSupportsLiveActivities: "YES"
        PRODUCT_NAME: LocalAI
        INFOPLIST_FILE: LocalAI/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/LocalAI/LocalAI-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/include"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - framework: ThirdParty/llama.xcframework
        embed: true
      - target: SiriWidget

  SiriWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.Siri.widget
        PRODUCT_NAME: SiriWidget
        INFOPLIST_FILE: Widget/Info.plist
        MARKETING_VERSION: "27.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
