name: 构建 iOS 应用

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装工具
        run: |
          brew install cmake xcodegen || true
          xcodegen --version
          cmake --version

      - name: 选择最新 Xcode
        run: |
          ls /Applications | grep -i xcode || true
          for v in 26.2 26.1 26.0 26; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 下载内置模型
        run: |
          set -e
          mkdir -p LocalAI/Resources/Models
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o LocalAI/Resources/Models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            "https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o LocalAI/Resources/Models/Llama-3.2-1B-Instruct-Q4_K_M.gguf \
            "https://hf-mirror.com/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
          ls -lh LocalAI/Resources/Models
          du -sh LocalAI/Resources

      - name: 缓存 llama.cpp 编译产物
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: llama-xcf-${{ runner.os }}-${{ hashFiles('scripts/build-llama-ios.sh') }}

      - name: 编译 llama.cpp（iOS）
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-llama-ios.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 App
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalAI.xcodeproj \
            -scheme LocalAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 IPA
        run: |
          set -e
          rm -rf Payload LocalAI.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LocalAI.app Payload/
          zip -0 -qry LocalAI.ipa Payload
          ls -lh LocalAI.ipa

      - name: 发布到 Release（带重试）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --title "最新构建" --prerelease \
              --notes "自动构建的未签名 IPA。内置 0.5B / 1B 本地模型，Siri AI 界面。"
          for i in 1 2 3 4; do
            if gh release upload latest LocalAI.ipa --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "上传成功"; exit 0
            fi
            echo "第 $i 次上传失败，20 秒后重试"; sleep 20
          done
          echo "上传失败"; exit 1

  packs:
    # 只有手动触发时才做：把视觉模型压缩成 .gz 放到 models 这个 tag 下
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - repo: SmolVLM-256M-Instruct-GGUF
            file: SmolVLM-256M-Instruct-Q8_0.gguf
          - repo: SmolVLM-256M-Instruct-GGUF
            file: mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
          - repo: SmolVLM-500M-Instruct-GGUF
            file: SmolVLM-500M-Instruct-Q8_0.gguf
          - repo: SmolVLM-500M-Instruct-GGUF
            file: mmproj-SmolVLM-500M-Instruct-Q8_0.gguf
    steps:
      - name: 下载并压缩
        run: |
          set -e
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${{ matrix.file }}" \
            "https://hf-mirror.com/ggml-org/${{ matrix.repo }}/resolve/main/${{ matrix.file }}"
          gzip -1 -f "${{ matrix.file }}"
          ls -lh "${{ matrix.file }}.gz"

      - name: 上传到 Release（带重试）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view models --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create models --repo "$GITHUB_REPOSITORY" --title "视觉模型包" --notes "压缩后的 SmolVLM 模型，App 下载后后台解压。"
          for i in 1 2 3; do
            if gh release upload models "${{ matrix.file }}.gz" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "上传成功"; exit 0
            fi
            echo "第 $i 次失败，10 秒后重试"; sleep 10
          done
          echo "上传失败"; exit 1
